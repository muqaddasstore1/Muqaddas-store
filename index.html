<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muqaddas Store - Premium Cheese</title>
<style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #fff8f0; }
    h1 { text-align: center; color: #d2691e; }
    .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .product { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
    .product img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
    .product h3 { color: #333; margin: 10px 0 5px 0; font-size: 15px; }
    .price { font-size: 18px; font-weight: bold; color: #d2691e; margin: 5px 0 10px 0; }
    .btn { background: #d2691e; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; width: 100%; margin-bottom: 8px; font-size: 14px; }
    .btn:hover { background: #b8561a; }
    .cart { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .cart h2 { color: #d2691e; }
    #cartItems div { padding: 8px 0; border-bottom: 1px solid #eee; }
    #whatsappBtn { background: #25D366; margin-top: 15px; }
    input, textarea { width: 100%; padding: 8px; margin: 5px 0 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
</style>
</head>
